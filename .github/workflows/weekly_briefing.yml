name: YSL Beauty Intelligence Briefing

on:
  schedule:
    # Mondays at 08:30 in Spain. GitHub cron runs in UTC, so we schedule both
    # possible UTC times and keep only the one matching Europe/Madrid locally.
    - cron: '30 6 * * 1'
    - cron: '30 7 * * 1'

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no envia email)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Spain delivery time
        id: schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_time="$(TZ=Europe/Madrid date +%H:%M)"
          echo "Current time in Spain: $local_time"

          if [ "$local_time" = "08:30" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run briefing agent
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python briefing_agent.py

      - name: Guardar memoria en el repo
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        run: |
          git config user.name "Beauty Briefing Bot"
          git config user.email "bot@briefing.local"
          git add memory.json || true
          git diff --staged --quiet || git commit -m "Update memory [skip ci]"
          git push || true

      - name: Upload logs on failure
        if: failure() && steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: briefing-error-logs-${{ github.run_id }}
          path: briefing_agent.log
          retention-days: 30
