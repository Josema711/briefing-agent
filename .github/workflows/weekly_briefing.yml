name: YSL Beauty Intelligence Briefing

on:
  schedule:
    # Lunes a las 9:00 AM hora España (UTC+2 verano → 07:00 UTC)
    # En invierno (UTC+1) cambia a: '0 8 * * 1'
    - cron: '45 7 * * 1'

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no envía email, solo imprime el briefing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq

      - name: Run briefing agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python briefing_agent.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-error-logs-${{ github.run_id }}
          path: briefing_agent.log
          retention-days: 30
