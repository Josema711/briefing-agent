name: YSL Beauty Intelligence Briefing

on:
  schedule:
    # Lunes a primera hora. La zona IANA mantiene la hora en verano e invierno.
    # Se evita el minuto 0 para reducir retrasos por carga de GitHub Actions.
    - cron: '17 7 * * 1'
      timezone: 'Europe/Madrid'

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no envia email)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
          CC_EMAIL: ${{ secrets.CC_EMAIL }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python briefing_agent.py

      - name: Guardar memoria en el repo
        if: success() && (github.event_name == 'schedule' || github.event.inputs.test_mode != 'true')
        run: |
          git config user.name "Beauty Briefing Bot"
          git config user.email "bot@briefing.local"
          git add memory.json
          git diff --staged --quiet || git commit -m "Update memory [skip ci]"
          git push

      - name: Upload test preview
        if: success() && github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: briefing-preview-${{ github.run_id }}
          path: briefing_preview.html
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: briefing-error-logs-${{ github.run_id }}
          path: briefing_agent.log
          retention-days: 30
