name: YSL Beauty Intelligence Briefing

on:
  schedule:
    # Lunes 9:00 AM España verano (UTC+2 → 07:00 UTC)
    # En invierno cambiar a: '0 8 * * 1'
    - cron: '45 7 * * 1'

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no envía email)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq

      - name: Run briefing agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python briefing_agent.py

      - name: Guardar memoria en el repo
        if: always()
        run: |
          git config user.name "Beauty Briefing Bot"
          git config user.email "bot@briefing.local"
          git add memory.json || true
          git diff --staged --quiet || git commit -m "Update memory [skip ci]"
          git push || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-error-logs-${{ github.run_id }}
          path: briefing_agent.log
          retention-days: 30
